<!doctype html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Splash · Dawn</title>
<style>
  :root {
    --clay: #d97757;      /* Claude 陶土橙 */
    --clay-deep: #b4532a;
    --ivory: #faf6ef;
    --ink: #3b2519;
    --hud: rgba(246, 236, 222, .78);   /* HUD 文字颜色：夜里是象牙白，天亮后由脚本改成墨色 */
    --hud-dim: rgba(246, 236, 222, .42);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  body { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }

  #stage { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 46% 42%, #1a1420 0%, #0c0a10 55%, #050407 100%); }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #cam { position: absolute; inset: 0; transform-origin: 40% 40%; will-change: transform; }
  /* 透明度最低 0.003 而不是 0：保持图层“预热”，第一次显示时不卡（沿用原项目的做法） */
  /* 图层先隐藏，快用到时才显示（见 splash.js 里的 show）：用不到的全屏图层不占 GPU */
  #cam canvas, #cam video { object-fit: cover; object-position: center; opacity: 0; visibility: hidden; }
  #rays, #rib, #flash, #vignette { opacity: 0; visibility: hidden; }
  #vignette { background: radial-gradient(140% 110% at 45% 40%, rgba(0,0,0,0) 55%, rgba(40,18,8,.28) 100%); }

  /* ---------- 左上：品牌、时钟、批注 ---------- */
  #hudTL, #stages { text-shadow: var(--hud-shadow, none); }
  #hudTL { position: absolute; left: 3vw; top: 4.2vh; color: var(--hud); font: 500 clamp(10px, .78vw, 14px)/1.5 "Cascadia Mono", "Consolas", monospace; letter-spacing: .22em; opacity: 0; }
  #hudTL .brand { font-weight: 700; letter-spacing: .34em; }
  #hudTL .brand i { font-style: normal; color: var(--clay); margin-right: .5em; }
  #hudTL .clock { margin-top: .5em; font-size: 1.55em; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
  #hudTL .meta { margin-top: .4em; color: var(--hud-dim); }
  #hudTL .meta b { font-weight: 500; color: var(--clay); }

  /* ---------- 左下：阶段条 ---------- */
  #stages { position: absolute; left: 3vw; bottom: 5vh; width: min(46vw, 640px); color: var(--hud); opacity: 0; }
  #stages .row { display: flex; gap: 2.2vw; }
  #stages .st { display: flex; align-items: baseline; gap: .55em; font: 500 clamp(10px, .74vw, 13px)/1 "Cascadia Mono", "Consolas", monospace; letter-spacing: .2em; color: var(--hud-dim); transition: color .35s; white-space: nowrap; }
  #stages .st .zh { font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; letter-spacing: .25em; }
  #stages .st.on { color: var(--hud); }
  #stages .st.on .n { color: var(--clay); }
  #stages .st.done { color: var(--hud); }
  #stages .track { position: relative; margin-top: 1.4vh; height: 9px; }
  #stages .track::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: var(--hud-dim); }
  #stages .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--hud-dim) 0 1px, transparent 1px 2.5%); -webkit-mask: linear-gradient(#000 0 0) top/100% 3px no-repeat; mask: linear-gradient(#000 0 0) top/100% 3px no-repeat; }
  #stages .fill { position: absolute; left: 0; top: 3px; height: 3px; width: 0; background: linear-gradient(90deg, rgba(217,119,87,.25), var(--clay)); }
  #stages .fill::after { content: ""; position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--clay); box-shadow: 0 0 10px 2px rgba(255,160,110,.7); }

  /* ---------- 右上：字标 + 欢迎语 ---------- */
  #title { position: absolute; left: 62vw; top: 8.5vh; width: 35vw; color: var(--ink); }
  #title .tag { font: 600 clamp(10px, .82vw, 15px)/1 "Cascadia Mono", "Consolas", monospace; letter-spacing: .42em; color: var(--clay-deep); opacity: 0; }
  #mark { display: block; width: min(31vw, 560px); height: auto; margin-top: 1.2vh; overflow: visible; }
  #mark text { font-family: "Georgia", "Cambria", "Times New Roman", serif; font-size: 112px; letter-spacing: -1px; }
  #title .rule { margin: 1.4vh 0 1.8vh; height: 2px; width: 0; background: linear-gradient(90deg, var(--clay), rgba(217,119,87,0)); }
  #title .welcome { font-size: clamp(15px, 1.55vw, 28px); letter-spacing: .26em; min-height: 1.4em; white-space: nowrap; }
  #title .welcome em { font-style: normal; color: var(--clay-deep); font-weight: 600; letter-spacing: .12em; }
  #title .caret { display: inline-block; width: .07em; height: .95em; margin-left: .12em; background: var(--clay); vertical-align: -.1em; opacity: 0; }
  #title .sub { margin-top: 1.3vh; font: 500 clamp(10px, .72vw, 13px)/1 "Cascadia Mono", "Consolas", monospace; letter-spacing: .32em; color: rgba(59,37,25,.55); opacity: 0; }
  /* 有语音时：这一行换成语音说的那句话，用衬线斜体 */
  #title .sub.quote { margin-top: 1.6vh; font: italic 400 clamp(13px, 1.05vw, 19px)/1.2 "Georgia", "Cambria", serif; letter-spacing: .04em; color: rgba(140,62,30,.82); }

  #flash { z-index: 6; }
  #fade { background: #000; opacity: 0; z-index: 7; }
  #hint { position: fixed; right: 18px; bottom: 14px; font: 12px/1 sans-serif; color: rgba(255,255,255,.55); opacity: 0; transition: opacity .3s; z-index: 9; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  body.hint #hint { opacity: 1; }
  /* 启动器模式：右下角很淡的“点击跳过”（按键多半被 Claude 收走，只有点击可靠） */
  #skip { position: absolute; right: 26px; bottom: 22px; font: 13px/1 "Microsoft YaHei UI", sans-serif; letter-spacing: .12em; color: rgba(255,255,255,.8); opacity: 0; z-index: 8; pointer-events: none;
    padding: 7px 12px; border-radius: 14px; background: rgba(20,12,8,.32); border: 1px solid rgba(255,255,255,.18); text-shadow: 0 1px 2px rgba(0,0,0,.5); display: none; }
  #missing { position: absolute; left: 50%; bottom: 18vh; transform: translateX(-50%); color: rgba(246,236,222,.7); font-size: 13px; letter-spacing: .1em; display: none; z-index: 9; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <canvas id="color" class="layer"></canvas>
    <video id="vid" class="layer" muted playsinline preload="auto"></video>
    <!-- 发梢飘动层在视频上面：视频播完时只把这一层显示出来，不去隐藏视频（隐藏视频那一下会卡） -->
    <canvas id="sway" class="layer"></canvas>
    <!-- 口型：只盖住嘴附近的一小块（位置由 splash.js 的 placeMouth 计算） -->
    <canvas id="wash" class="layer"></canvas>
    <canvas id="line" class="layer"></canvas>
    <canvas id="lineDraw" class="layer"></canvas>
    <canvas id="lineEyes" class="layer"></canvas>
    <canvas id="pen" class="layer"></canvas>
    <canvas id="rim" class="layer"></canvas>
  </div>
  <!-- 流光丝带在角色前面：晕染时盖在角色上的夜色不会把还没退场的丝带一下子遮掉 -->
  <canvas id="rib" class="layer"></canvas>
  <canvas id="rays" class="layer"></canvas>
  <canvas id="fx" class="layer"></canvas>
  <div id="vignette" class="layer"></div>

  <div id="hudTL">
    <div class="brand"><i>✱</i>CLAUDE · DAWN</div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="meta" id="meta">SESSION <b>0x2F</b> · 2700K</div>
  </div>

  <div id="stages">
    <div class="row">
      <div class="st" data-i="0"><span class="n">01</span><span class="en">SKETCH</span><span class="zh">勾勒</span></div>
      <div class="st" data-i="1"><span class="n">02</span><span class="en">INK</span><span class="zh">晕染</span></div>
      <div class="st" data-i="2"><span class="n">03</span><span class="en">DAWN</span><span class="zh">醒来</span></div>
      <div class="st" data-i="3"><span class="n">04</span><span class="en">READY</span><span class="zh">就绪</span></div>
    </div>
    <div class="track"><div class="ticks"></div><div class="fill" id="fill"></div></div>
  </div>

  <div id="title">
    <div class="tag" id="tag">CLAUDE</div>
    <svg id="mark" viewBox="0 0 560 140" aria-label="Claude">
      <defs>
        <linearGradient id="gFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3b2519"/><stop offset=".55" stop-color="#5a2f1c"/><stop offset="1" stop-color="#b4532a"/>
        </linearGradient>
        <linearGradient id="gSweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="0">
          <stop offset="0" stop-color="#fff6e8" stop-opacity="0"/><stop offset=".5" stop-color="#fff6e8" stop-opacity=".95"/><stop offset="1" stop-color="#fff6e8" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g id="mStar" transform="translate(56 78)"></g>
      <text id="wm" x="124" y="112" fill="url(#gFill)" fill-opacity="0" stroke="#b4532a" stroke-width="1.6" stroke-dasharray="900" stroke-dashoffset="900">Claude</text>
      <text id="wmSweep" x="124" y="112" fill="url(#gSweep)" opacity="0">Claude</text>
    </svg>
    <div class="rule" id="rule"></div>
    <div class="welcome"><span id="wtext"></span><span class="caret" id="caret"></span></div>
    <div class="sub" id="sub">SESSION READY · 一切就绪</div>
  </div>

  <canvas id="flash" class="layer"></canvas>
  <div id="fade" class="layer"></div>
  <div id="skip">点击跳过</div>
  <div id="missing">没有找到角色图：请先运行 <b>tools\get-art.ps1</b>（见 README）<br>Character art not found: run tools\get-art.ps1 first.</div>
</div>
<div id="hint">空格 / R 重播 · F 全屏 · 双击全屏</div>

<script src="config.example.js"></script>
<script src="config.js"></script>
<script>
  // 选择角色图：默认取 config.js 里的 art；页面参数 ?art=classic|new 优先（启动器的 -Art 会加上这个参数）。
  // 角色图不在本项目里：从原项目的克隆（artRoot，默认 third_party/claude-desktop-splash）读取。
  (function () {
    var C = window.SPLASH_CONFIG || {}, q = new URLSearchParams(location.search);
    var art = (q.get('art') || C.art) === 'classic' ? 'classic' : 'new';
    var root = String(C.artRoot || 'third_party/claude-desktop-splash').replace(/[\\/]+$/, '') + '/assets/';
    window.SPLASH_ART = art; window.SPLASH_ART_ROOT = root;
    var dir = art === 'classic' ? root + 'classic/' : root;
    document.write('<script src="' + dir + 'claude-closed.js"><\/script><script src="' + dir + 'eyes-frames.js"><\/script>');
    // 结尾语音：config.js 里 voiceId（设置页面写入）；页面参数 ?voice=<id> 优先（设置页面的“预览动画”用）
    var vid = String(q.get('voice') || C.voiceId || 'sonia').replace(/[^a-z0-9-]/gi, '');
    document.write('<script src="assets/voices/' + vid + '.js"><\/script>');
  })();
</script>
<script src="js/sound.js"></script>
<script src="js/splash.js"></script>
</body>
</html>
